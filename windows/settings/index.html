<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FocusPet 설정</title>
  <link rel="stylesheet" href="settings.css" />
  <script type="importmap">
    { "imports": { "three": "../../node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <header>
    <span class="header-icon">🐾</span>
    <h1>FocusPet 설정</h1>
  </header>

  <main>
    <!-- Settings-window equivalents of the tray menu's own quick actions
         (pause/resume, show/hide, "test now") plus "오늘 하루 알림 끄기" -
         see main.js's setPaused/setPetVisible/getStatus/broadcastStatus for
         how these two surfaces (this card and the tray menu) always stay in
         sync with each other regardless of which one triggers a change. -->
    <section class="card">
      <label class="section-title">빠른 제어</label>
      <div class="quick-controls-list">
        <label class="toggle-row">
          <span class="toggle-row-label">알림 일시정지</span>
          <span class="toggle">
            <input type="checkbox" id="quickPaused" />
            <span class="toggle-track"></span>
          </span>
        </label>
        <label class="toggle-row">
          <span class="toggle-row-label">펫 표시</span>
          <span class="toggle">
            <input type="checkbox" id="quickPetVisible" />
            <span class="toggle-track"></span>
          </span>
        </label>
        <label class="toggle-row">
          <span class="toggle-row-label">오늘 하루 알림 끄기</span>
          <span class="toggle">
            <input type="checkbox" id="quickOffToday" />
            <span class="toggle-track"></span>
          </span>
        </label>
      </div>
      <button type="button" id="quickTestNow" class="secondary quick-test-btn">지금 바로 알림 테스트</button>
    </section>

    <section class="card">
      <label class="section-title">캐릭터</label>
      <div id="char-grid" class="char-grid"></div>
    </section>

    <section class="card">
      <label class="section-title">언제 알려줄까요?</label>
      <div class="mode-options">
        <label class="radio-row">
          <input type="radio" name="mode" value="interval" />
          <span class="radio-text">
            <span class="radio-title">고정 간격</span>
            <span class="radio-hint">뽀모도로 스타일 — 강의 시청 등 입력이 적은 작업에 적합</span>
          </span>
        </label>
        <label class="radio-row">
          <input type="radio" name="mode" value="idle" />
          <span class="radio-text">
            <span class="radio-title">활동 감지</span>
            <span class="radio-hint">키보드·마우스 입력이 없을 때만</span>
          </span>
        </label>
      </div>

      <div id="interval-section" class="sub-field">
        <label class="field-label" for="intervalMinutes">알림 간격 (분)</label>
        <input type="number" id="intervalMinutes" min="1" max="180" />
      </div>

      <div id="idle-section" class="sub-field">
        <label class="field-label" for="idleThresholdMinutes">입력 없음 감지 기준 (분)</label>
        <input type="number" id="idleThresholdMinutes" min="1" max="180" />
      </div>
    </section>

    <section class="card">
      <label class="section-title">이동 방식</label>
      <!-- Replaces the old 4-way "펫 위치" corner picker - the pet is now
           always anchored right above the taskbar (see main.js's
           groundWindowY), so a discrete corner choice no longer means
           anything; this picks whether it wanders left/right along that
           taskbar or just stays wherever it was last dragged/snapped to. -->
      <div class="mode-options">
        <label class="radio-row">
          <input type="radio" name="movementMode" value="stationary" />
          <span class="radio-text">
            <span class="radio-title">한 곳에 가만히</span>
            <span class="radio-hint">놓인 자리에 머무르며 그루밍·앉기 등 평소 행동만 반복</span>
          </span>
        </label>
        <label class="radio-row">
          <input type="radio" name="movementMode" value="pacing" />
          <span class="radio-text">
            <span class="radio-title">좌우 이동</span>
            <span class="radio-hint">화면 하단을 천천히 왕복 — 끝에 도착하면 잠시 쉬었다 돌아옴</span>
          </span>
        </label>
      </div>
    </section>

    <section class="card">
      <label class="section-title">알림 소리</label>
      <label class="toggle-row">
        <span class="toggle-row-label">알림 소리 재생</span>
        <span class="toggle">
          <input type="checkbox" id="soundEnabled" />
          <span class="toggle-track"></span>
        </span>
      </label>
      <div class="sub-field">
        <label class="field-label" id="soundVolumeLabel" for="soundVolume">소리 크기 (50%)</label>
        <input type="range" id="soundVolume" min="0" max="100" step="1" />
      </div>
    </section>

    <section class="card">
      <label class="section-title">일반</label>
      <label class="toggle-row">
        <span class="toggle-row-label">Windows 시작 시 자동 실행</span>
        <span class="toggle">
          <input type="checkbox" id="launchAtStartup" />
          <span class="toggle-track"></span>
        </span>
      </label>
    </section>

    <section class="card">
      <label class="section-title">알림 메시지</label>
      <span class="section-hint">한 줄에 하나씩 입력하세요</span>
      <textarea id="messages" rows="5" placeholder="비워두면 기본 유머 대사가 자동으로 사용돼요"></textarea>
    </section>
  </main>

  <footer>
    <!-- "기본값으로 채우기"(draft-only, needs Save) vs. "전체 설정
         초기화"(persists immediately, confirm() first) are genuinely
         different in WHEN they take effect, not just two buttons doing the
         same reset - this caption + the button labels themselves spell
         that difference out so it's not something you only discover by
         hovering (title attrs below add the fuller explanation on hover,
         but shouldn't be the only place it's stated). -->
    <p class="footer-hint">기본값으로 채우기는 저장을 눌러야 적용돼요 · 전체 설정 초기화는 확인 후 바로 저장까지 끝나요</p>
    <div class="footer-row">
      <button id="resetAllBtn" type="button" class="danger-link" title="확인 후 모든 설정을 즉시 기본값으로 되돌리고 저장까지 끝내요 (되돌릴 수 없어요)">전체 설정 초기화</button>
      <div class="footer-actions">
        <button id="resetBtn" class="secondary" title="폼에 기본값을 채워 넣을 뿐, 저장을 눌러야 실제로 적용돼요">기본값으로 채우기</button>
        <button id="saveBtn" class="primary">저장</button>
      </div>
    </div>
  </footer>

  <script type="module" src="settings.js"></script>
</body>
</html>
