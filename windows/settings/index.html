<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FocusPet 설정</title>
  <link rel="stylesheet" href="settings.css" />
  <script type="importmap">
    { "imports": { "three": "../../node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <header>
    <span class="header-icon">🐾</span>
    <h1>FocusPet 설정</h1>
  </header>

  <main>
    <section class="card">
      <label class="section-title">캐릭터</label>
      <div id="char-grid" class="char-grid"></div>
    </section>

    <section class="card">
      <label class="section-title">언제 알려줄까요?</label>
      <div class="mode-options">
        <label class="radio-row">
          <input type="radio" name="mode" value="interval" />
          <span class="radio-text">
            <span class="radio-title">고정 간격</span>
            <span class="radio-hint">뽀모도로 스타일 — 강의 시청 등 입력이 적은 작업에 적합</span>
          </span>
        </label>
        <label class="radio-row">
          <input type="radio" name="mode" value="idle" />
          <span class="radio-text">
            <span class="radio-title">활동 감지</span>
            <span class="radio-hint">키보드·마우스 입력이 없을 때만</span>
          </span>
        </label>
      </div>

      <div id="interval-section" class="sub-field">
        <label class="field-label" for="intervalMinutes">알림 간격 (분)</label>
        <input type="number" id="intervalMinutes" min="1" max="180" />
      </div>

      <div id="idle-section" class="sub-field">
        <label class="field-label" for="idleThresholdMinutes">입력 없음 감지 기준 (분)</label>
        <input type="number" id="idleThresholdMinutes" min="1" max="180" />
      </div>
    </section>

    <section class="card">
      <label class="section-title">이동 방식</label>
      <!-- Replaces the old 4-way "펫 위치" corner picker - the pet is now
           always anchored right above the taskbar (see main.js's
           groundWindowY), so a discrete corner choice no longer means
           anything; this picks whether it wanders left/right along that
           taskbar or just stays wherever it was last dragged/snapped to. -->
      <div class="mode-options">
        <label class="radio-row">
          <input type="radio" name="movementMode" value="stationary" />
          <span class="radio-text">
            <span class="radio-title">한 곳에 가만히</span>
            <span class="radio-hint">놓인 자리에 머무르며 그루밍·앉기 등 평소 행동만 반복</span>
          </span>
        </label>
        <label class="radio-row">
          <input type="radio" name="movementMode" value="pacing" />
          <span class="radio-text">
            <span class="radio-title">좌우 이동</span>
            <span class="radio-hint">화면 하단을 천천히 왕복 — 끝에 도착하면 잠시 쉬었다 돌아옴</span>
          </span>
        </label>
      </div>
    </section>

    <section class="card">
      <label class="section-title">알림 소리</label>
      <label class="toggle-row">
        <span class="toggle-row-label">알림 소리 재생</span>
        <span class="toggle">
          <input type="checkbox" id="soundEnabled" />
          <span class="toggle-track"></span>
        </span>
      </label>
      <div class="sub-field">
        <label class="field-label" id="soundVolumeLabel" for="soundVolume">소리 크기 (50%)</label>
        <input type="range" id="soundVolume" min="0" max="100" step="1" />
      </div>
    </section>

    <section class="card">
      <label class="section-title">알림 메시지</label>
      <span class="section-hint">한 줄에 하나씩 입력하세요</span>
      <textarea id="messages" rows="5" placeholder="비워두면 기본 유머 대사가 자동으로 사용돼요"></textarea>
    </section>
  </main>

  <footer>
    <button id="resetBtn" class="secondary">기본값으로</button>
    <button id="saveBtn" class="primary">저장</button>
  </footer>

  <script type="module" src="settings.js"></script>
</body>
</html>
